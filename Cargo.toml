[workspace]
resolver = "2"
members = ["crates/*", "modules/sdk/rust", "modules/sources/hevy", "modules/sources/mynetdiary", "src-tauri"]
# Installable source module crates join the workspace when their plans add them.

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
jsonschema = "0.33"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wasmtime = { version = "=47.0.3", default-features = false, features = ["async", "component-model", "component-model-async", "cranelift", "runtime"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"
wasmparser = { version = "=0.252.0", features = ["component-model"] }
